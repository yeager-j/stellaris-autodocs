l_english:
# The file r14's same-path collision removes whole. Four keys, of which the winning mod file
# restates exactly one, so the other three are the raw-key casualties the record measured
# (`tech_society_1 -> tech_society_1`). Three rather than one so their order is observable.
#
# Carries a byte-order mark, as every one of the 2318 vanilla localization files does. Its
# sibling main_2 carries none and uses CRLF, so both real encodings reach ingestion through a
# committed corpus rather than only through inline test literals.
 tech_subject:0 "Vanilla subject"
 tech_same_file_control:0 "Vanilla same-file control"
 tech_lost_a:0 "Vanilla lost A"
 tech_lost_b: "Vanilla lost B"
