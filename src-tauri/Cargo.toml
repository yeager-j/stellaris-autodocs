[package]
name = "stellaris-docs"
version = "0.1.0"
description = "Generates accurate player documentation from installed Stellaris mods"
authors = ["Jackson Yeager"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a Windows bin-name conflict (cargo #8519).
name = "stellaris_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Plain `[dependencies]`, not a target-cfg table, and registered without `#[cfg(desktop)]`. This
# project targets macOS, Windows, and Linux; the plugin is not optional for a Desktop Host that
# owns an application-data directory (D-065, D-092). If a mobile target is ever added, the compile
# error is the right reminder that "one process per application-data directory" needs an answer
# there rather than an omission that already compiled.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4"] }
jomini = { version = "0.35", default-features = false }
tempfile = { version = "3", optional = true }

[features]
# Test-only helpers (isolated app-data directories, later fixture-corpus support).
# Enabled for this package's own tests through the self dev-dependency below;
# never enabled by a production build.
test-support = ["dep:tempfile"]

[dev-dependencies]
stellaris-docs = { path = ".", features = ["test-support"] }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
