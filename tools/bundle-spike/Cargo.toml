[package]
name = "bundle-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Evidence harness for docs/spikes/revision-bundle-evaluation.md. Throwaway: it measures whether build-time denormalized JSON can back a Documentation Revision bundle, and is not the bundle."

# Deliberately not a member of any workspace, for the reason tools/parser-spike/Cargo.toml
# states: nothing here may enter src-tauri's dependency graph before an ADR accepts it, and a
# spike that shares a lock file with the application would make that boundary a matter of
# discipline rather than structure.
[workspace]

[dependencies]
# The adopted adapters, by path rather than by copy.
#
# ADR 0007 accepted Jomini consumed through parser-spike's `lexer`, and ADR 0008 accepted
# image_dds consumed through dds-spike's pinned recipe. Forking either into this crate would
# mean these bundle measurements describe a parser and a decoder that no decision accepted,
# and a later fix to the adopted adapter would silently stop applying here. Both crates are
# their own workspace roots, so depending on them does not pull anything into src-tauri.
#
# What is NOT reused is each spike's corpus and record scaffolding. This spike's unit of
# measurement is a *revision case* — one Vanilla contributor plus one Target Mod, resolved
# together — rather than a single tree, so its corpus module states a different thing and
# shares only an algorithm small enough that coupling would cost more than restating.
parser-spike = { path = "../parser-spike" }
dds-spike = { path = "../dds-spike" }

sha2 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Max-RSS, as the second and independent reading of retained memory. The first is the
# model's own deep byte accounting; a budget met by one measure and missed by the other is a
# finding rather than a rounding decision.
libc = "0.2"

[profile.release]
debug = true
