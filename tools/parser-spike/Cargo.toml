[package]
name = "parser-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Evidence harness for docs/spikes/parser-evaluation.md. Throwaway: it measures whether Jomini can back the app's parser adapter, and is not the adapter."

# Deliberately not a member of any workspace. Jomini must not enter src-tauri's dependency
# graph before an ADR accepts it, and a spike that shares a lock file with the application
# would make that boundary a matter of discipline rather than structure.
[workspace]

[dependencies]
jomini = { version = "0.35.0", default-features = false }
sha2 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
debug = true
