[package]
name = "dds-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Evidence harness for docs/spikes/dds-evaluation.md. Throwaway: it measures whether image_dds can back the app's asset decoder, and is not the decoder."

# Deliberately not a member of any workspace, for the reason tools/parser-spike/Cargo.toml
# states: image_dds must not enter src-tauri's dependency graph before an ADR accepts it, and a
# spike that shares a lock file with the application would make that boundary a matter of
# discipline rather than structure.
[workspace]

[dependencies]
# `default-features = false` is a decision, not tidiness. The default `encode` feature pulls
# intel_tex_2, which compiles through the Intel ISPC compiler and ships no precompiled kernels
# for every target. Decoding never needs it, and ADR 0005 commits to macOS, Windows, and Linux
# releases; a decoder that cannot build on one of them is not a decoder this project can adopt.
#
# The `image` feature is off too. It exists to provide `image_from_dds`, which decodes every
# array layer and stacks them vertically — a cube map becomes an image six times too tall, with
# no error. The recipe selects one layer explicitly, so the convenience entry point is not merely
# unused but wrong for this application.
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile"] }

# The independent second reading of the same bytes, for the compressed classes. Independence is
# structural rather than asserted: image_dds decodes BC through bcdec_rs, and texture2ddecoder is
# an unrelated implementation. Two readings that share a decoder would agree about its bugs.
texture2ddecoder = "0.1.2"

# The encoders are named directly rather than reached through `image`, because encoder identity
# participates in the asset key (`docs/technical-design.md:503`). A re-exporter's own version can
# stay still while the encoder behind it moves, and an asset key derived from a version that can
# lie about the bytes is not a key.
png = "0.18"
# Pure Rust. The popular `webp` crate binds libwebp in C, which would reintroduce exactly the
# cross-platform build risk that dropping image_dds's `encode` feature avoids.
image-webp = "0.2"

sha2 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
